# ponytail: single service — backend already serves frontend/dist, so no separate
# static host and no CORS/VITE_API_URL wiring. DATABASE_URL comes from Neon (free tier).
services:
  - type: web
    name: infiltrator
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
